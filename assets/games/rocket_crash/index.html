<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rocket Crash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#020818;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}

/* ── root layout ── */
#root{display:flex;flex-direction:column;height:100%;max-height:100dvh}
#topbar{flex:0 0 auto;padding:6px 10px 0}
#game-area{flex:1 1 0;display:flex;min-height:0;overflow:hidden;position:relative}
#bottom{flex:0 0 auto;padding:4px 6px env(safe-area-inset-bottom,6px);background:linear-gradient(0deg,#020818 85%,transparent)}

/* ── top bar ── */
#title-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
#back-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.09);border:none;color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
#game-title{font-size:17px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#00d4ff,#7b2fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#round-lbl{margin-left:auto;font-size:10px;color:#5ec8ff;font-weight:700}
#sound-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07);border:none;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* balance strip */
#bal-row{display:flex;align-items:center;gap:5px;padding:0 0 4px}
#bal-val{font-size:14px;font-weight:900;color:#ffd97a}
#bal-lbl{font-size:10px;color:rgba(255,255,255,.38);font-weight:700}

/* history */
#hist-row{display:flex;gap:4px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;min-height:20px}
#hist-row::-webkit-scrollbar{display:none}
.hchip{flex-shrink:0;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid transparent;cursor:default}
.hlow {background:rgba(220,50,50,.2);border-color:#dc3232;color:#ff7070}
.hmid {background:rgba(255,165,0,.15);border-color:#ffa500;color:#ffd97a}
.hhigh{background:rgba(0,200,100,.15);border-color:#00c864;color:#5affb0}
.hmega{background:rgba(130,0,255,.2);border-color:#8200ff;color:#c87aff}

/* ── left feed ── */
#feed{width:36%;max-width:138px;overflow-y:auto;padding:4px 3px 4px 4px;scrollbar-width:none;display:flex;flex-direction:column;gap:3px}
#feed::-webkit-scrollbar{display:none}
.fi{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border-radius:9px;padding:4px 5px;flex-shrink:0;border:1px solid rgba(255,255,255,.05)}
.fav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}
.finf{flex:1;min-width:0}
.fbet{font-size:9px;color:#7a9ab8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwin{font-size:10px;font-weight:900;white-space:nowrap}
.fwin.won{color:#5affb0}.fwin.lost{color:#ff5555}.fwin.live{color:#ffd97a}

/* ── canvas area ── */
#cwrap{flex:1;position:relative;overflow:hidden}
#rc{display:block;width:100%;height:100%}

/* multiplier overlay */
#mult-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:10}
#mult-val{font-size:52px;font-weight:900;letter-spacing:-1px;line-height:1;transition:color .15s}
#mult-val.flying {color:#00d4ff;text-shadow:0 0 36px #00d4ff80}
#mult-val.crashed{color:#ff3a3a;text-shadow:0 0 36px #ff3a3a80}
#mult-val.waiting{color:#ffd97a;text-shadow:0 0 24px #ffd97a60}
#mult-lbl{font-size:11px;color:rgba(255,255,255,.5);font-weight:700;letter-spacing:2px;margin-top:2px}

/* phase text */
#phase-wrap{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:11;min-width:200px}
#phase-txt{font-size:15px;font-weight:900;color:#ffd97a;letter-spacing:.8px}
#phase-sub{font-size:12px;color:rgba(255,255,255,.45);margin-top:2px}

/* countdown bar */
#cdown-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08);z-index:12}
#cdown-fill{height:100%;background:linear-gradient(90deg,#7b2fff,#00d4ff);transition:width .9s linear;width:100%}

/* right markers */
#markers{position:absolute;right:3px;top:6px;bottom:6px;display:flex;flex-direction:column;justify-content:space-evenly;pointer-events:none;z-index:5}
.mrk{font-size:9px;color:rgba(94,200,255,.35);font-weight:700}

/* win toast */
#win-toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,200,100,.18);border:1px solid #00c864;border-radius:14px;padding:8px 20px;text-align:center;pointer-events:none;z-index:20;opacity:0;transition:opacity .25s,transform .25s}
#win-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#win-toast .wt-mult{font-size:22px;font-weight:900;color:#5affb0}
#win-toast .wt-amt{font-size:13px;color:rgba(255,255,255,.7);margin-top:1px}

/* error toast */
#err-toast{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);background:rgba(180,0,0,.7);border:1px solid #ff4444;border-radius:10px;padding:7px 16px;font-size:12px;font-weight:800;color:#ffaaaa;z-index:25;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
#err-toast.show{opacity:1}

/* ── panels ── */
#panels{display:flex;gap:5px}
.panel{flex:1;background:linear-gradient(155deg,#0b1d3e,#060f22);border:1.5px solid rgba(94,200,255,.18);border-radius:14px;padding:7px 6px 6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.panel.p-armed{border-color:#ffd97a;box-shadow:0 0 10px rgba(255,217,122,.2)}
.panel.p-cashed{border-color:#5affb0;box-shadow:0 0 10px rgba(90,255,176,.2)}
.panel.p-lost{border-color:#ff5555;box-shadow:0 0 8px rgba(255,85,85,.15)}

/* mode toggle */
.mode-row{display:flex;border:1px solid rgba(255,255,255,.1);border-radius:7px;overflow:hidden}
.mmode{flex:1;padding:4px 0;font-size:10px;font-weight:800;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,.35);transition:all .2s}
.mmode.on{background:rgba(94,200,255,.18);color:#00d4ff}

/* amount row */
.amt-row{display:flex;align-items:center;gap:3px}
.ac{width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ac:active{background:rgba(94,200,255,.2)}
.adisp{flex:1;text-align:center;font-size:13px;font-weight:900;color:#ffd97a;background:rgba(255,217,122,.07);border:1px solid rgba(255,217,122,.18);border-radius:7px;padding:4px 2px}

/* chip row */
.chips{display:flex;gap:3px}
.chip{flex:1;padding:3px 0;border-radius:5px;font-size:9px;font-weight:800;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.75);cursor:pointer;text-align:center;white-space:nowrap}
.chip:active{background:rgba(94,200,255,.18)}

/* auto row */
.auto-row{display:flex;align-items:center;gap:4px}
.auto-lbl{font-size:9px;color:rgba(255,255,255,.45);font-weight:700;white-space:nowrap}
.auto-inp{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:6px;padding:3px 5px;color:#fff;font-size:11px;font-weight:800;text-align:center;width:0;min-width:0}

/* action button */
.abtn{width:100%;padding:10px 4px;border-radius:10px;font-size:13px;font-weight:900;border:none;cursor:pointer;letter-spacing:.4px;transition:background .2s,box-shadow .2s;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abtn:active:not(:disabled){filter:brightness(.88)}
.abtn.bet    {background:linear-gradient(135deg,#1a6fff,#0044cc);color:#fff;box-shadow:0 4px 14px rgba(0,100,255,.35)}
.abtn.armed  {background:linear-gradient(135deg,#b87400,#ffaa00);color:#000}
.abtn.cashout{background:linear-gradient(135deg,#00a84e,#00ff7f);color:#000;box-shadow:0 4px 14px rgba(0,200,100,.35);animation:pg .75s infinite alternate}
.abtn.won    {background:linear-gradient(135deg,#006b32,#00c864);color:#fff}
.abtn.lost   {background:rgba(160,0,0,.3);color:#ff9090}
.abtn.locked {background:rgba(255,255,255,.05);color:rgba(255,255,255,.28)}
.abtn:disabled{cursor:default}

/* During flight/crash: collapse betting controls, enlarge action button */
.panel.fly .mode-row,
.panel.fly .amt-row,
.panel.fly .chips,
.panel.fly .auto-row{display:none!important}
.panel.fly .abtn{padding:18px 4px;font-size:16px;border-radius:14px;margin-top:0}
@keyframes pg{from{box-shadow:0 4px 12px rgba(0,200,100,.3)}to{box-shadow:0 4px 24px rgba(0,255,120,.65)}}
</style>
</head>
<body>
<div id="root">
  <!-- TOP BAR -->
  <div id="topbar">
    <div id="title-row">
      <button id="back-btn" onclick="closeGame()">&#8592;</button>
      <span id="game-title">ROCKET CRASH</span>
      <span id="round-lbl">Round #0</span>
      <button id="sound-btn" onclick="toggleSound()">🔊</button>
    </div>
    <div id="bal-row">
      <span style="font-size:14px">⚡</span>
      <span id="bal-val">0</span>
      <span id="bal-lbl">coins</span>
    </div>
    <div id="hist-row"></div>
  </div>

  <!-- GAME AREA -->
  <div id="game-area">
    <div id="feed"></div>
    <div id="cwrap">
      <canvas id="rc"></canvas>
      <div id="mult-wrap">
        <div id="mult-val" class="waiting">1.00x</div>
        <div id="mult-lbl">MULTIPLIER</div>
      </div>
      <div id="phase-wrap">
        <div id="phase-txt"></div>
        <div id="phase-sub"></div>
      </div>
      <div id="cdown-bar"><div id="cdown-fill"></div></div>
      <div id="markers">
        <span class="mrk">25x</span>
        <span class="mrk">10x</span>
        <span class="mrk">5x</span>
        <span class="mrk">2x</span>
        <span class="mrk">1x</span>
      </div>
      <div id="win-toast">
        <div class="wt-mult" id="wt-mult">×2.00</div>
        <div class="wt-amt" id="wt-amt">+1000 coins</div>
      </div>
      <div id="err-toast"></div>
    </div>
  </div>

  <!-- BOTTOM PANELS -->
  <div id="bottom">
    <div id="panels">
      <!-- SLOT 0 -->
      <div class="panel" id="panel0">
        <div class="mode-row">
          <button class="mmode on" id="m0-m" onclick="setMode(0,'manual')">Manual</button>
          <button class="mmode"    id="m0-a" onclick="setMode(0,'auto')">Auto</button>
        </div>
        <div class="amt-row">
          <button class="ac" onclick="adjAmt(0,-1)">−</button>
          <div class="adisp" id="amt0">100</div>
          <button class="ac" onclick="adjAmt(0,1)">+</button>
        </div>
        <div class="chips">
          <button class="chip" onclick="setAmt(0,100)">100</button>
          <button class="chip" onclick="setAmt(0,500)">500</button>
          <button class="chip" onclick="setAmt(0,1000)">1K</button>
          <button class="chip" onclick="setAmt(0,2000)">2K</button>
          <button class="chip" onclick="setAmt(0,5000)">5K</button>
        </div>
        <div class="auto-row" id="ar0" style="display:none">
          <span class="auto-lbl">Auto @</span>
          <input class="auto-inp" id="at0" type="number" min="1.01" max="100" step="0.01" value="2.00">
          <span class="auto-lbl">x</span>
        </div>
        <button class="abtn bet" id="btn0" onclick="slotTap(0)">BET 1</button>
      </div>
      <!-- SLOT 1 -->
      <div class="panel" id="panel1">
        <div class="mode-row">
          <button class="mmode on" id="m1-m" onclick="setMode(1,'manual')">Manual</button>
          <button class="mmode"    id="m1-a" onclick="setMode(1,'auto')">Auto</button>
        </div>
        <div class="amt-row">
          <button class="ac" onclick="adjAmt(1,-1)">−</button>
          <div class="adisp" id="amt1">500</div>
          <button class="ac" onclick="adjAmt(1,1)">+</button>
        </div>
        <div class="chips">
          <button class="chip" onclick="setAmt(1,100)">100</button>
          <button class="chip" onclick="setAmt(1,500)">500</button>
          <button class="chip" onclick="setAmt(1,1000)">1K</button>
          <button class="chip" onclick="setAmt(1,2000)">2K</button>
          <button class="chip" onclick="setAmt(1,5000)">5K</button>
        </div>
        <div class="auto-row" id="ar1" style="display:none">
          <span class="auto-lbl">Auto @</span>
          <input class="auto-inp" id="at1" type="number" min="1.01" max="100" step="0.01" value="2.00">
          <span class="auto-lbl">x</span>
        </div>
        <button class="abtn bet" id="btn1" onclick="slotTap(1)">BET 2</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════
const WAIT_SECS      = 8;
const CRASH_DELAY_MS = 4000;
const AMT_STEPS      = [100,200,500,1000,2000,5000,10000,20000,50000];
const FAKE_NAMES     = ['Ali','Sara','Omar','Nora','Fahad','Layla','Khalid','Maha','Yusuf','Rana'];
const AVT_COLORS     = ['#7b2fff','#ff5caa','#1a6fff','#ff8c00','#00c864','#e63946','#00b4d8'];

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const G = {
  phase:    'init',  // init|waiting|flying|crashed
  round:    0,
  mult:     1.00,
  crashAt:  2.00,
  startTs:  0,
  balance:  0,
  locale:   'en',
  soundOn:  true,
  history:  [],
  feedItems:[],
  hasRealFeed: false,
  // Server sync
  roundId:           null,  // uuid from server
  serverFlightStartMs: 0,   // epoch ms when flight began (server time)
  clockOffset:         0,   // serverNowMs - Date.now() at last calibration
  bettingEndsAtMs:     0,   // epoch ms for betting deadline
  // Timers
  waitTmr:  null,
  waitSecs: WAIT_SECS,
  rafId:    null,
  // Slots
  slots: [
    { mode:'manual', amount:100,  state:'idle', betId:null, autoT:2.0, winAmt:0, cashing:false },
    { mode:'manual', amount:500,  state:'idle', betId:null, autoT:2.0, winAmt:0, cashing:false },
  ],
};

// ═══════════════════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════════════════
let _ac = null;
let _audioUnlocked = false;

function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  return _ac;
}

function unlockAudio() {
  if (_audioUnlocked) return;
  try {
    const c = getAC();
    if (c.state === 'suspended') c.resume();
    const b = c.createBuffer(1,1,22050);
    const s = c.createBufferSource();
    s.buffer = b; s.connect(c.destination); s.start(0);
    _audioUnlocked = true;
  } catch(e) {}
}

document.addEventListener('click',      unlockAudio, {passive:true});
document.addEventListener('touchstart', unlockAudio, {passive:true});

const SFX = {
  _p(fn) {
    if (!G.soundOn) return;
    try { fn(getAC()); } catch(e) {}
  },
  tap()       { this._p(c=>{ osc(c,'sine',880,.16,.08); }); },
  arm()       { this._p(c=>{ const o=c.createOscillator(),g=c.createGain(); o.type='triangle'; o.frequency.setValueAtTime(440,c.currentTime); o.frequency.linearRampToValueAtTime(900,c.currentTime+.14); g.gain.setValueAtTime(.22,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18); }); },
  cancel()    { this._p(c=>{ osc(c,'sawtooth',300,.15,.22,200); }); },
  tick(sec)   { this._p(c=>{ const f=440+(WAIT_SECS-sec)*30; osc(c,'sine',f,.1,.06); }); },
  launch()    { this._p(c=>{ noise(c,.55,.45); }); },
  flightTick(m){ this._p(c=>{ const f=Math.min(1800,280+m*75); osc(c,'sine',f,.05,.05); }); },
  cashout()   { this._p(c=>{ [0,.07,.14].forEach((dt,i)=>{ osc(c,'sine',[523,659,784][i],.25,.22,null,dt); }); }); },
  crash()     { this._p(c=>{ noise(c,.8,.65); }); },
  newRound()  { this._p(c=>{ osc(c,'triangle',330,.1,.25); }); },
};

function osc(c,type,freq,gain,dur,freqEnd,dt=0) {
  const o=c.createOscillator(),g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,c.currentTime+dt);
  if (freqEnd!=null) o.frequency.linearRampToValueAtTime(freqEnd,c.currentTime+dt+dur);
  g.gain.setValueAtTime(gain,c.currentTime+dt);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dt+dur);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+dt);o.stop(c.currentTime+dt+dur);
}
function noise(c,gain,dur) {
  const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.2);
  const s=c.createBufferSource(),g=c.createGain();
  s.buffer=buf; g.gain.setValueAtTime(gain,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
  s.connect(g);g.connect(c.destination);s.start();
}

// ═══════════════════════════════════════════════════════════════════════════
// CANVAS / ANIMATION
// ═══════════════════════════════════════════════════════════════════════════
const cvs = document.getElementById('rc');
const cx  = cvs.getContext('2d');
let _stars = [];
let _flameT = 0;
let _shakeEnd = 0;
let _explodeTs = 0;
let _flightPath = []; // {x,y} trail points

function initStars() {
  _stars = [];
  for (let i=0;i<70;i++) _stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,sp:Math.random()*.25+.05});
}

function resizeCvs() {
  cvs.width  = cvs.parentElement.clientWidth;
  cvs.height = cvs.parentElement.clientHeight;
  initStars();
  _flightPath = [];
}
window.addEventListener('resize', resizeCvs);
resizeCvs();

// rocketY: 0 = bottom of canvas, 1 = near top
function rocketPos() {
  const W=cvs.width, H=cvs.height;
  const progress = G.phase==='flying'
    ? Math.min(.9, (G.mult-1) / Math.max(.5, G.crashAt-1) * .9)
    : 0;
  return {
    x: W * .74,
    y: H * .88 - progress * H * .76,
    progress,
  };
}

function drawFrame(ts) {
  G.rafId = requestAnimationFrame(drawFrame);
  const W=cvs.width, H=cvs.height;
  if (!W || !H) return;
  cx.clearRect(0,0,W,H);

  // starfield scroll during flight
  cx.save();
  const scroll = G.phase==='flying' ? ts/9000 : 0;
  _stars.forEach(s => {
    const x = ((s.x + scroll*s.sp) % 1) * W;
    const a = G.phase==='flying' ? Math.min(.9, s.r*.6) : Math.min(.5, s.r*.35);
    cx.beginPath();
    cx.arc(x, s.y*H, s.r, 0, Math.PI*2);
    cx.fillStyle = `rgba(255,255,255,${a})`;
    cx.fill();
  });
  cx.restore();

  // explosion rings
  if (G.phase==='crashed' && _explodeTs>0) {
    const age = (ts - _explodeTs)/1000;
    if (age < 1.4) {
      const {x:rx,y:ry} = rocketPos();
      [0,.12,.26].forEach((delay,i) => {
        const r = Math.max(0,(age-delay)*110);
        const a = Math.max(0,.7-age*.55);
        cx.beginPath();
        cx.arc(rx,ry,r,0,Math.PI*2);
        cx.strokeStyle=`rgba(255,${120-i*40},0,${a})`;
        cx.lineWidth=4-i;
        cx.stroke();
      });
    }
  }

  // draw flight path trail
  if (_flightPath.length > 1) {
    cx.save();
    cx.beginPath();
    cx.moveTo(_flightPath[0].x, _flightPath[0].y);
    for (let i=1;i<_flightPath.length;i++) cx.lineTo(_flightPath[i].x, _flightPath[i].y);
    cx.strokeStyle = 'rgba(0,200,255,.18)';
    cx.lineWidth = 2;
    cx.stroke();
    cx.restore();
  }

  // rocket
  if (G.phase==='flying' || G.phase==='waiting' || G.phase==='crashed') {
    const pos = rocketPos();
    let rx=pos.x, ry=pos.y;

    // record trail
    if (G.phase==='flying') {
      if (!_flightPath.length || Math.abs(ry - _flightPath[_flightPath.length-1].y)>3) {
        _flightPath.push({x:rx,y:ry});
        if (_flightPath.length>120) _flightPath.shift();
      }
    }

    // launch shake
    const shaking = ts < _shakeEnd;
    if (shaking) { rx+=(Math.random()-.5)*5; ry+=(Math.random()-.5)*5; }

    // flame (only while flying or shaking)
    if (G.phase==='flying' || shaking) {
      _flameT = (_flameT+.2)%(Math.PI*2);
      const fh=28+Math.sin(_flameT)*7, fw=9+Math.sin(_flameT*1.4)*2;
      const fg=cx.createLinearGradient(rx,ry+14,rx,ry+14+fh);
      fg.addColorStop(0,'rgba(255,210,0,.95)');
      fg.addColorStop(.55,'rgba(255,70,0,.7)');
      fg.addColorStop(1,'rgba(255,20,0,0)');
      cx.save();
      cx.beginPath();
      cx.ellipse(rx,ry+14+fh/2,fw,fh/2,0,0,Math.PI*2);
      cx.fillStyle=fg;
      cx.fill();
      cx.restore();
    }

    if (G.phase!=='crashed' || _explodeTs===0) {
      // rocket body
      cx.save();
      cx.translate(rx,ry);
      const bg=cx.createLinearGradient(-13,0,13,0);
      bg.addColorStop(0,'#1240cc');bg.addColorStop(.5,'#5ec8ff');bg.addColorStop(1,'#1240cc');
      cx.beginPath();
      cx.moveTo(0,-23);
      cx.bezierCurveTo(10,-17,12,0,10,15);
      cx.lineTo(-10,15);
      cx.bezierCurveTo(-12,0,-10,-17,0,-23);
      cx.fillStyle=bg;cx.fill();
      cx.strokeStyle='rgba(94,200,255,.45)';cx.lineWidth=1;cx.stroke();
      // porthole
      cx.beginPath();cx.arc(0,-4,5,0,Math.PI*2);cx.fillStyle='#a0e8ff';cx.fill();
      cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=1;cx.stroke();
      // fins
      [[-10,15,1],[10,15,-1]].forEach(([fx,fy,d])=>{
        cx.beginPath();cx.moveTo(fx,fy);cx.lineTo(fx+d*18,fy+10);cx.lineTo(fx+d*8,fy);
        cx.fillStyle='#0a3aff';cx.fill();
      });
      // glow
      if (G.phase==='flying') {
        const gl=cx.createRadialGradient(rx,ry,0,rx,ry,32);
        gl.addColorStop(0,'rgba(0,200,255,.12)');gl.addColorStop(1,'rgba(0,100,255,0)');
        cx.beginPath();cx.arc(0,0,32,0,Math.PI*2);cx.fillStyle=gl;cx.fill();
      }
      cx.restore();
    }
  }
}
requestAnimationFrame(drawFrame);

// ═══════════════════════════════════════════════════════════════════════════
// CRASH GENERATOR
// Biased toward low values:
//   ~8 % chance  < 1.05 (very early crash)
//   ~40%          1.05 – 2.5
//   ~30%          2.5  – 6
//   ~15%          6    – 15
//   ~7 %          > 15
// ═══════════════════════════════════════════════════════════════════════════
function genCrash() {
  const r = Math.random();
  if (r < 0.04) return 1.00;
  if (r < 0.08) return 1.00 + Math.random() * 0.04;
  return Math.max(1.01, Math.min(200, 0.96 / (1 - r)));
}

// ═══════════════════════════════════════════════════════════════════════════
// ROUND LOOP
// ═══════════════════════════════════════════════════════════════════════════
function startWaiting() {
  clearInterval(G.waitTmr);
  G.phase   = 'waiting';
  G.round  += 1;
  G.mult    = 1.00;
  G.crashAt = genCrash();
  G.serverFlightStartMs = 0;
  _flightPath = [];
  _explodeTs  = 0;

  document.getElementById('round-lbl').textContent = 'Round #' + G.round;
  setMult(1.00,'waiting');
  setPhase('PLACE YOUR BETS', G.waitSecs + 's');
  setCdown(1.0);
  SFX.newRound();

  G.slots.forEach(s => {
    if (['won','lost','idle'].includes(s.state)) {
      s.state='idle'; s.betId=null; s.winAmt=0; s.cashing=false;
    }
  });
  renderSlots();

  G.waitSecs = WAIT_SECS;
  G.waitTmr  = setInterval(waitTick, 1000);
}

function waitTick() {
  G.waitSecs--;
  SFX.tick(G.waitSecs);
  setPhase('PLACE YOUR BETS', G.waitSecs + 's');
  setCdown(G.waitSecs / WAIT_SECS);
  if (G.waitSecs <= 0) {
    clearInterval(G.waitTmr);
    startFlight();
  }
}

// Returns current multiplier using server time when available, local perf.now() otherwise.
function getCurrentMult() {
  if (G.serverFlightStartMs > 0) {
    const nowMs = Date.now() + G.clockOffset;
    const elapsed = Math.max(0, (nowMs - G.serverFlightStartMs) / 1000);
    return Math.max(1.00, parseFloat(Math.pow(Math.E, 0.055 * elapsed).toFixed(2)));
  }
  const elapsed = (performance.now() - G.startTs) / 1000;
  return Math.max(1.00, parseFloat(Math.pow(Math.E, 0.055 * elapsed).toFixed(2)));
}

// Core flight animation loop (called by startFlight and handleRoundState).
function startFlightLoop() {
  let lastTickM = G.mult || 1.0;
  const FLY_INTERVAL = 50;
  function flightStep() {
    if (G.phase !== 'flying') return;
    G.mult = getCurrentMult();
    setMult(G.mult, 'flying');
    if (G.mult - lastTickM >= 0.5) { SFX.flightTick(G.mult); lastTickM = G.mult; }
    G.slots.forEach((s,i) => {
      if (s.state==='armed' && s.mode==='auto' && s.betId && !s.cashing && G.mult >= s.autoT) {
        console.log('[RocketCrash] auto cashout trigger betId=' + s.betId + ' target=' + s.autoT + ' current=' + G.mult.toFixed(2));
        doCashout(i);
      }
    });
    if (G.mult >= G.crashAt) {
      if (G.roundId) postToFlutter('REQUEST_SETTLE_ROUND', {roundId: G.roundId});
      doCrash();
      return;
    }
    setTimeout(flightStep, FLY_INTERVAL);
  }
  setTimeout(flightStep, FLY_INTERVAL);
}

function _doStartFlight() {
  G.phase   = 'flying';
  G.mult    = 1.00;
  G.startTs = performance.now();
  _shakeEnd = performance.now() + 420;
  setPhase('', '');
  setCdown(0);
  SFX.launch();
  G.slots.forEach(s => { if (s.state==='pending') { s.state='idle'; s.betId=null; } });
  renderSlots();
  startFlightLoop();
}

function startFlight() {
  // Reject pending slots that didn't receive BET_ACCEPTED in time
  G.slots.forEach(s => { if (s.state==='pending') { s.state='idle'; s.betId=null; } });
  renderSlots();
  setPhase('LAUNCHING…', '');
  setCdown(0);

  if (G.roundId) {
    // Server-driven: ask Flutter to call start_rocket_crash_flight RPC.
    // Flutter responds with SET_ROUND_STATE {phase:'flying'}.
    postToFlutter('REQUEST_START_FLIGHT', {roundId: G.roundId});
    // Local fallback: if no server response in 3s, start with local crash point.
    setTimeout(() => {
      if (G.phase === 'waiting') {
        G.crashAt = genCrash();
        G.serverFlightStartMs = 0;
        _doStartFlight();
      }
    }, 3000);
  } else {
    G.crashAt = genCrash();
    G.serverFlightStartMs = 0;
    _doStartFlight();
  }
}

function doCrash() {
  G.phase    = 'crashed';
  G.mult     = G.crashAt;
  _explodeTs = performance.now();
  SFX.crash();
  console.log('[RocketCrash] crash result roundId=' + (G.roundId || 'local') + ' crashPoint=' + G.crashAt.toFixed(2));
  setMult(G.crashAt, 'crashed');
  setPhase('CRASHED @ ' + G.crashAt.toFixed(2) + 'x', '');

  G.slots.forEach((s,i) => {
    if (s.state === 'armed' || s.state === 'cashing') {
      const wasArmed = s.state === 'armed';
      s.state = 'lost';
      if (wasArmed && s.betId) {
        addFeedLost(i, s.amount);
        // Global round: server settle handles marking bets lost.
        // Legacy local mode only:
        if (!G.roundId) {
          postToFlutter('REQUEST_BET_LOST', { slotIndex:i, betId:s.betId, crashMultiplier:G.crashAt });
        }
      }
    }
  });
  renderSlots();
  addHistory(G.crashAt);

  if (G.roundId) {
    // Flutter will send SET_ROUND_STATE {phase:'betting'} after settling.
    // Safety fallback: if no new round arrives in CRASH_DELAY_MS + 5s, revert to local.
    setTimeout(() => {
      if (G.phase === 'crashed') {
        G.roundId = null;
        startWaiting();
      }
    }, CRASH_DELAY_MS + 5000);
  } else {
    setTimeout(startWaiting, CRASH_DELAY_MS);
  }
}

function addHistory(v) {
  G.history.unshift(v);
  if (G.history.length > 14) G.history.pop();
  renderHistory();
}

// ═══════════════════════════════════════════════════════════════════════════
// SLOT LOGIC
// ═══════════════════════════════════════════════════════════════════════════
function slotTap(i) {
  unlockAudio();
  const s = G.slots[i];
  if (G.phase === 'waiting') {
    if (s.state === 'idle')   armBet(i);
    else if (s.state === 'armed') cancelBet(i);
  } else if (G.phase === 'flying') {
    // Part A: allow manual cashout in both manual AND auto mode
    if (s.state === 'armed' && !s.cashing) doCashoutManual(i);
  }
}

function armBet(i) {
  const s = G.slots[i];
  if (G.balance <= 0) { showErr('Wallet not ready'); return; }
  if (s.amount > G.balance) { showErr('Not enough coins'); return; }
  // Lock in auto target now so it cannot change during flight
  if (s.mode === 'auto') {
    const inp = document.getElementById('at'+i);
    s.autoT = Math.max(1.01, parseFloat(inp ? inp.value : '2.00') || 2.0);
  }
  s.state  = 'pending';
  s.betId  = null;
  s.cashing= false;
  renderSlots();
  SFX.arm();
  if (G.roundId) {
    postToFlutter('REQUEST_PLACE_BET', {
      slotIndex: i,
      amount: s.amount,
      roundId: G.roundId,
      autoCashoutMultiplier: s.mode === 'auto' ? s.autoT : null,
    });
  } else {
    postToFlutter('REQUEST_BET_DEBIT', { slotIndex:i, amount:s.amount });
  }
}

function cancelBet(i) {
  const s = G.slots[i];
  if (!['armed','pending'].includes(s.state)) return;
  SFX.cancel();
  if (s.betId) {
    s.state = 'cancelling';
    renderSlots();
    postToFlutter('REQUEST_BET_REFUND', { slotIndex:i, betId:s.betId });
  } else {
    s.state = 'idle'; s.betId = null;
    renderSlots();
  }
}

function doCashout(i) {
  const s = G.slots[i];
  // Guard: only valid during flight, armed, betId present, not already cashing
  if (G.phase !== 'flying') return;
  if (s.state !== 'armed' || !s.betId || s.cashing) return;
  s.cashing = true;
  renderSlots();
  postToFlutter('REQUEST_CASHOUT_CREDIT', { slotIndex:i, betId:s.betId, multiplier:G.mult });
}

function doCashoutManual(i) {
  console.log('[RocketCrash] manual cashout tap betId=' + (G.slots[i].betId || 'none') + ' mult=' + G.mult.toFixed(2));
  doCashout(i);
}

// ═══════════════════════════════════════════════════════════════════════════
// FLUTTER → WEB MESSAGE HANDLER
// ═══════════════════════════════════════════════════════════════════════════
// ─── handleRoundState: sync JS phase to a server round snapshot ─────────────
function handleRoundState(round) {
  if (!round) return;
  if (round.serverNowMs) G.clockOffset = round.serverNowMs - Date.now();
  G.roundId = round.roundId || G.roundId;

  const phase = round.phase || round.status || '';

  if (phase === 'betting') {
    G.mult    = 1.00;
    G.crashAt = 2.00;
    G.serverFlightStartMs = 0;
    _flightPath = [];
    _explodeTs  = 0;

    const rn = round.roundNumber || (G.round + 1);
    if (rn !== G.round) {
      G.round = rn;
      document.getElementById('round-lbl').textContent = 'Round #' + G.round;
    }

    clearInterval(G.waitTmr);
    setMult(1.00, 'waiting');
    SFX.newRound();

    // Reset resolved slots; preserve armed slots that still have betIds
    G.slots.forEach(s => {
      if (['won','lost','idle'].includes(s.state)) {
        s.state='idle'; s.betId=null; s.winAmt=0; s.cashing=false;
      }
    });

    // Restore my bets for this round
    if (round.myBets) {
      round.myBets.forEach((bet, i) => {
        if (i < G.slots.length && bet && bet.betId) {
          G.slots[i].state = 'armed';
          G.slots[i].betId  = bet.betId;
          G.slots[i].amount = bet.amount || G.slots[i].amount;
          G.slots[i].mode   = bet.autoCashout ? 'auto' : 'manual';
          G.slots[i].autoT  = bet.autoCashout || 2.0;
        }
      });
    }

    G.phase = 'waiting';
    const nowMs    = Date.now() + G.clockOffset;
    const msLeft   = (round.bettingEndsAtMs || 0) - nowMs;
    G.waitSecs     = Math.max(0, Math.ceil(msLeft / 1000));
    G.bettingEndsAtMs = round.bettingEndsAtMs || 0;

    setPhase('PLACE YOUR BETS', G.waitSecs + 's');
    setCdown(G.waitSecs / WAIT_SECS);
    renderSlots();
    G.waitTmr = setInterval(waitTick, 1000);

  } else if (phase === 'flying') {
    const cm  = round.crashMultiplier || 2.00;
    const fsMs = round.flightStartsAtMs || (Date.now() + G.clockOffset);
    G.crashAt = cm;
    G.serverFlightStartMs = fsMs;

    if (G.phase !== 'flying') {
      clearInterval(G.waitTmr);

      if (round.myBets) {
        round.myBets.forEach((bet, i) => {
          if (i < G.slots.length && bet && bet.betId) {
            G.slots[i].state = 'armed';
            G.slots[i].betId  = bet.betId;
            G.slots[i].amount = bet.amount || G.slots[i].amount;
            G.slots[i].mode   = bet.autoCashout ? 'auto' : 'manual';
            G.slots[i].autoT  = bet.autoCashout || 2.0;
          }
        });
      }

      // Check if already past crash point (joined after crash)
      const m = getCurrentMult();
      if (m >= G.crashAt) {
        G.crashAt = m;
        doCrash();
        return;
      }

      G.phase   = 'flying';
      G.mult    = getCurrentMult();
      G.startTs = performance.now(); // fallback if serverFlightStartMs lost
      _shakeEnd = 0;                 // no launch shake for mid-flight join
      _flightPath = [];
      setPhase('', '');
      setCdown(0);
      SFX.launch();
      renderSlots();
      startFlightLoop();
    }

  } else if (phase === 'crashed') {
    if (G.phase !== 'crashed') {
      G.crashAt  = round.crashMultiplier || G.crashAt;
      G.mult     = G.crashAt;
      G.phase    = 'crashed';
      _explodeTs = performance.now();
      SFX.crash();
      setMult(G.crashAt, 'crashed');
      setPhase('CRASHED @ ' + G.crashAt.toFixed(2) + 'x', '');
      G.slots.forEach(s => {
        if (s.state === 'armed' || s.state === 'cashing') s.state = 'lost';
      });
      renderSlots();
      addHistory(G.crashAt);
    }
    // Next round arrives via SET_ROUND_STATE {phase:'betting'}
  }
}

// ─── handleBetsUpdate: replace feed with real server bets ───────────────────
function handleBetsUpdate(bets) {
  if (!bets || !bets.length) return;
  G.hasRealFeed = true;
  G.feedItems = bets.map(b => ({
    name    : b.displayName || 'Player',
    color   : b.isOwn ? '#00c864' : AVT_COLORS[Math.abs((b.displayName||'').charCodeAt(0)||0) % AVT_COLORS.length],
    betAmt  : b.betAmount || 0,
    winMult : b.cashoutMultiplier || null,
    state   : b.status === 'cashed_out' ? 'won' : b.status === 'lost' ? 'lost' : 'live',
  }));
  renderFeed();
}

window.onSroodMessage = function(msg) {
  const { type, payload } = msg;
  switch(type) {
    case 'INIT_GAME':
      G.balance = payload.balance || 0;
      G.locale  = payload.locale  || 'en';
      G.soundOn = payload.sound   !== false;
      updateSoundBtn();
      updateBal();
      if (payload.error === 'wallet_error') {
        showErr('Wallet error — balance may be unavailable');
      }
      if (payload.round) {
        // Pre-load history from server
        if (payload.round.history && payload.round.history.length) {
          G.history = payload.round.history.map(v => parseFloat(v) || 1.0);
          renderHistory();
        }
        handleRoundState(payload.round);
      } else {
        startWaiting();
      }
      break;

    case 'SET_ROUND_STATE':
      handleRoundState(payload);
      break;

    case 'HISTORY_UPDATE':
      if (payload.history && payload.history.length) {
        G.history = payload.history.map(v => parseFloat(v) || 1.0);
        renderHistory();
      }
      break;

    case 'BETS_UPDATE':
      handleBetsUpdate(payload.bets);
      break;

    case 'WALLET_UPDATED':
      G.balance = payload.balance || 0;
      updateBal();
      break;

    case 'BET_ACCEPTED': {
      const i = payload.slotIndex;
      const s = G.slots[i];
      s.state = 'armed';
      s.betId = payload.betId;
      if (payload.newBalance != null) G.balance = payload.newBalance;
      updateBal();
      addFeedBet(i, s.amount);
      renderSlots();
      break;
    }

    case 'BET_REJECTED': {
      const i = payload.slotIndex;
      G.slots[i].state = 'idle';
      G.slots[i].betId = null;
      const code = payload.code || '';
      showErr(code === 'insufficient_coins' ? 'Not enough coins' :
              code === 'not_authenticated'  ? 'Please sign in' : 'Bet failed');
      renderSlots();
      break;
    }

    case 'REFUND_ACCEPTED': {
      const i = payload.slotIndex;
      G.slots[i].state  = 'idle';
      G.slots[i].betId  = null;
      G.slots[i].cashing = false;
      if (payload.newBalance != null) G.balance = payload.newBalance;
      updateBal();
      renderSlots();
      break;
    }

    case 'REFUND_REJECTED': {
      const i = payload.slotIndex;
      // Revert to armed so user can try again or wait for crash
      if (G.slots[i].state === 'cancelling') G.slots[i].state = 'armed';
      renderSlots();
      showErr('Refund failed');
      break;
    }

    case 'CASHOUT_ACCEPTED': {
      const i   = payload.slotIndex;
      const s   = G.slots[i];
      const win = payload.winAmount || 0;
      const mult= payload.multiplier || G.mult;
      s.state   = 'won';
      s.winAmt  = win;
      s.betId   = null;
      s.cashing = false;
      if (payload.newBalance != null) G.balance = payload.newBalance;
      updateBal();
      SFX.cashout();
      showWin(mult, win);
      addFeedWon(i, s.amount, mult);
      renderSlots();
      break;
    }

    case 'CASHOUT_REJECTED': {
      const i = payload.slotIndex;
      const s = G.slots[i];
      s.cashing = false;
      // Revert to armed if still flying so player can retry
      if (G.phase === 'flying' && s.state !== 'lost') s.state = 'armed';
      renderSlots();
      showErr('Cashout failed – tap again');
      break;
    }
  }
};

// ═══════════════════════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function setMult(v, cls) {
  const el = document.getElementById('mult-val');
  el.textContent = v.toFixed(2) + 'x';
  el.className = cls;
}

function setPhase(main, sub) {
  document.getElementById('phase-txt').textContent = main;
  document.getElementById('phase-sub').textContent = sub;
}

function setCdown(ratio) { // 1=full, 0=empty
  document.getElementById('cdown-fill').style.width = (ratio * 100) + '%';
}

function updateBal() {
  document.getElementById('bal-val').textContent = G.balance.toLocaleString();
}

function renderHistory() {
  const row = document.getElementById('hist-row');
  row.innerHTML = '';
  G.history.forEach(v => {
    const c = document.createElement('span');
    c.className = 'hchip ' + (v < 1.5 ? 'hlow' : v < 3 ? 'hmid' : v < 10 ? 'hhigh' : 'hmega');
    c.textContent = v.toFixed(2) + 'x';
    row.appendChild(c);
  });
}

function renderSlots() {
  const inFlight = G.phase === 'flying' || G.phase === 'crashed';

  G.slots.forEach((s,i) => {
    const panel   = document.getElementById('panel'+i);
    const btn     = document.getElementById('btn'+i);
    const amtEl   = document.getElementById('amt'+i);
    const autoRow = document.getElementById('ar'+i);
    const mManual = document.getElementById('m'+i+'-m');
    const mAuto   = document.getElementById('m'+i+'-a');

    amtEl.textContent = fmtAmt(s.amount);

    // ── sync mode toggle classes ──────────────────────────────────────────
    if (mManual) mManual.classList.toggle('on', s.mode === 'manual');
    if (mAuto)   mAuto.classList.toggle('on',   s.mode === 'auto');
    // auto-row: visible only during waiting when slot is idle and mode=auto
    if (autoRow) {
      autoRow.style.display = (s.mode === 'auto' && !inFlight && s.state === 'idle') ? 'flex' : 'none';
    }

    // ── panel border class ────────────────────────────────────────────────
    panel.className = 'panel';
    if (inFlight) panel.classList.add('fly');
    if (s.state==='armed'||s.state==='cashing') panel.classList.add('p-armed');
    else if (s.state==='won')  panel.classList.add('p-cashed');
    else if (s.state==='lost') panel.classList.add('p-lost');

    // ── action button ─────────────────────────────────────────────────────
    btn.className = 'abtn';
    btn.disabled  = false;

    if (G.phase === 'init') {
      btn.textContent = 'Connecting…';
      btn.classList.add('locked');
      btn.disabled = true;

    } else if (G.phase === 'waiting') {
      if (s.state==='idle')
        { btn.textContent='BET '+(i+1); btn.classList.add('bet'); }
      else if (s.state==='pending'||s.state==='cancelling')
        { btn.textContent='…'; btn.classList.add('locked'); btn.disabled=true; }
      else if (s.state==='armed')
        { btn.textContent='✕ CANCEL'; btn.classList.add('armed'); }
      else if (s.state==='won')
        { btn.textContent='WON ✓'; btn.classList.add('won'); btn.disabled=true; }
      else if (s.state==='lost')
        { btn.textContent='LOST'; btn.classList.add('lost'); btn.disabled=true; }
      else
        { btn.textContent='BET '+(i+1); btn.classList.add('locked'); btn.disabled=true; }

    } else if (G.phase === 'flying') {
      if (s.state==='idle')
        { btn.textContent='Bet Next Round'; btn.classList.add('locked'); btn.disabled=true; }
      else if (s.state==='armed' && !s.cashing)
        // Part A: show cashout in both manual and auto modes
        { btn.textContent='💰 CASH OUT'+(s.mode==='auto'?' @'+s.autoT.toFixed(2)+'×':''); btn.classList.add('cashout'); }
      else if (s.state==='cashing')
        { btn.textContent='Processing…'; btn.classList.add('locked'); btn.disabled=true; }
      else if (s.state==='won') {
        const lbl = s.winAmt ? '+'+fmtAmt(s.winAmt)+' coins ✓' : 'WON ✓';
        btn.textContent=lbl; btn.classList.add('won'); btn.disabled=true;
      }
      else if (s.state==='lost')
        { btn.textContent='LOST'; btn.classList.add('lost'); btn.disabled=true; }
      else
        { btn.textContent='…'; btn.classList.add('locked'); btn.disabled=true; }

    } else if (G.phase === 'crashed') {
      if (s.state==='won') {
        const lbl = s.winAmt ? '+'+fmtAmt(s.winAmt)+' coins ✓' : 'WON ✓';
        btn.textContent=lbl; btn.classList.add('won'); btn.disabled=true;
      } else if (s.state==='lost')
        { btn.textContent='LOST'; btn.classList.add('lost'); btn.disabled=true; }
      else
        { btn.textContent='Next round…'; btn.classList.add('locked'); btn.disabled=true; }

    } else {
      btn.textContent='BET '+(i+1); btn.classList.add('locked'); btn.disabled=true;
    }
  });
}

let _winToastTmr = null;
function showWin(mult, amt) {
  const el = document.getElementById('win-toast');
  document.getElementById('wt-mult').textContent = '×' + mult.toFixed(2);
  document.getElementById('wt-amt').textContent  = '+' + fmtAmt(amt) + ' coins';
  el.classList.add('show');
  clearTimeout(_winToastTmr);
  _winToastTmr = setTimeout(() => el.classList.remove('show'), 2800);
}

let _errTmr = null;
function showErr(msg) {
  const el = document.getElementById('err-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_errTmr);
  _errTmr = setTimeout(() => el.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════════════════
function setMode(i, mode) {
  if (G.slots[i].state !== 'idle') return; // lock while armed/pending
  G.slots[i].mode = mode;
  renderSlots(); // syncs toggle classes and auto-row visibility
  SFX.tap();
}

function adjAmt(i, dir) {
  const s = G.slots[i];
  if (!['idle'].includes(s.state)) return; // can't change while armed
  const cur = AMT_STEPS.indexOf(s.amount);
  const ni = cur<0 ? (dir>0?1:0) : Math.max(0, Math.min(AMT_STEPS.length-1, cur+dir));
  s.amount = AMT_STEPS[ni];
  document.getElementById('amt'+i).textContent = fmtAmt(s.amount);
  SFX.tap();
}

function setAmt(i, v) {
  if (G.slots[i].state !== 'idle') return;
  G.slots[i].amount = v;
  document.getElementById('amt'+i).textContent = fmtAmt(v);
  SFX.tap();
}

function fmtAmt(v) {
  if (v >= 1000) return (v/1000).toFixed(v%1000===0?0:1)+'K';
  return ''+v;
}

function toggleSound() {
  G.soundOn = !G.soundOn;
  try { localStorage.setItem('rc_snd', G.soundOn?'1':'0'); } catch(e){}
  updateSoundBtn();
  postToFlutter('SET_SOUND_SETTING', {enabled: G.soundOn});
}
function updateSoundBtn() {
  document.getElementById('sound-btn').textContent = G.soundOn ? '🔊' : '🔇';
}

function closeGame() { postToFlutter('GAME_CLOSED', {}); }

// ═══════════════════════════════════════════════════════════════════════════
// FAKE PLAYER FEED
// ═══════════════════════════════════════════════════════════════════════════
function addFeedItem(name,color,betAmt,winMult,state) {
  G.feedItems.unshift({name,color,betAmt,winMult,state});
  if (G.feedItems.length > 10) G.feedItems.pop();
  renderFeed();
}
function addFeedBet(i,amt)       { addFeedItem('Bet '+(i+1),'#1a6fff',amt,null,'live'); }
function addFeedWon(i,amt,mult)  { addFeedItem('Bet '+(i+1),'#00c864',amt,mult,'won'); }
function addFeedLost(i,amt)      { addFeedItem('Bet '+(i+1),'#e63946',amt,null,'lost'); }

function renderFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  G.feedItems.forEach(item => {
    const d = document.createElement('div'); d.className='fi';
    const ini = item.name[0].toUpperCase();
    d.innerHTML =
      `<div class="fav" style="background:${item.color}">${ini}</div>`+
      `<div class="finf">`+
        `<div class="fbet">${item.name}: ${fmtAmt(item.betAmt)}</div>`+
        `<div class="fwin ${item.state}">${item.state==='won'?'×'+item.winMult.toFixed(2)+' ✓':item.state==='lost'?'LOST':'...'}</div>`+
      `</div>`;
    feed.appendChild(d);
  });
}

// inject fake players only when no real server feed is available
const _FAKE_AMTS=[100,200,500,1000,2000,5000];
setInterval(()=>{
  if (G.hasRealFeed) return; // real feed from server — no fakes needed
  if (G.phase==='waiting') {
    const n=FAKE_NAMES[Math.floor(Math.random()*FAKE_NAMES.length)];
    const c=AVT_COLORS[Math.floor(Math.random()*AVT_COLORS.length)];
    const a=_FAKE_AMTS[Math.floor(Math.random()*_FAKE_AMTS.length)];
    addFeedItem(n,c,a,null,'live');
  } else if (G.phase==='flying') {
    const live = G.feedItems.filter(f=>f.state==='live');
    if (live.length && Math.random()<.35) {
      const pick = live[Math.floor(Math.random()*live.length)];
      pick.state='won'; pick.winMult=G.mult;
      renderFeed();
    }
  }
}, 1600);

// ═══════════════════════════════════════════════════════════════════════════
// FLUTTER BRIDGE
// ═══════════════════════════════════════════════════════════════════════════
function postToFlutter(type, payload) {
  try {
    if (window.SroodBridge) window.SroodBridge.postMessage(JSON.stringify({type,payload}));
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════
(function boot() {
  try { const s=localStorage.getItem('rc_snd'); if(s!==null) G.soundOn=s==='1'; } catch(e){}
  updateSoundBtn();
  updateBal();
  setMult(1.00,'waiting');
  setPhase('CONNECTING…','');
  renderSlots();
  postToFlutter('GAME_READY', {});

  // Retry GAME_READY up to 3×  (never fall back to a fake balance)
  let _initAttempt = 0;
  function _retryInit() {
    if (G.phase !== 'init') return; // INIT_GAME already received
    _initAttempt++;
    if (_initAttempt <= 3) {
      setPhase('CONNECTING…', 'Attempt ' + (_initAttempt + 1) + '/4');
      postToFlutter('GAME_READY', {});
      setTimeout(_retryInit, 3000);
    } else {
      setPhase('WALLET ERROR', 'Restart the game');
      showErr('Could not connect to wallet');
    }
  }
  setTimeout(_retryInit, 3000);
})();
</script>
